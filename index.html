<!DOCTYPE html>
<html>
<head>
<title>TLEOTS GUIDE</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:serif;
    background:#8b6f47;
    text-align:center;
}

/* OPENING */
#opening{
    position:absolute;
}

/* ENTER WORLD */
#enter{
    display:none;
}

h1{
    color:#6fa8dc;
    font-size:50px;
    margin:0;
}

p{
    opacity:0.7;
}

button{
    margin-top:20px;
    padding:12px 25px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#6fa8dc;
    color:white;
}
</style>

</head>

<body>

<!-- 🌙 OPENING -->
<div id="opening">
    <h1>TLEOTS GUIDE</h1>
    <p>MB World</p>
</div>

<!-- 🚪 ENTER WORLD -->
<div id="enter">
    <button onclick="startWorld()">Enter World</button>
</div>

<script>

setTimeout(() => {
    document.getElementById("opening").style.display = "none";
    document.getElementById("enter").style.display = "flex";
}, 2500);

function startWorld(){
    alert("Welcome to TLEOTS");
}

</script>

</body>
</html>
