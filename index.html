<!DOCTYPE html>
<html>
<head>

<title>TLEOTS GUIDE</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#8b6f47;
    font-family:serif;
    overflow:hidden;
    text-align:center;
}

/* OPENING */
#opening{
    transition:opacity 1s ease;
}

/* JUDUL */
h1{
    font-size:70px;
    color:#6fa8dc;
    text-shadow:0 0 10px rgba(212,175,55,0.5);
    margin:0;
}

/* SUBTITLE */
p{
    font-size:16px;
    opacity:0.8;
}

/* ENTER WORLD */
#enter{
    height:100vh;
    display:none;
    justify-content:center;
    align-items:center;
}

/* BUTTON */
button{
    padding:14px 30px;
    font-size:18px;
    background:linear-gradient(45deg,#d4af37,#6fa8dc);
    border:none;
    border-radius:12px;
    color:white;
    cursor:pointer;
    box-shadow:0 0 15px rgba(212,175,55,0.5);
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* MAWAR */
.rose{
    width:80px;
    opacity:0.15;
    position:absolute;
    pointer-events:none;
}p
}
</style>

</head>

<body>
<img class="rose" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Rose_icon.svg/1024px-Rose_icon.svg.png" style="top:20px; left:20px;">
<img class="rose" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Rose_icon.svg/1024px-Rose_icon.svg.png" style="top:20px; right:20px;">
<img class="rose" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Rose_icon.svg/1024px-Rose_icon.svg.png" style="bottom:20px; left:20px;">
<img class="rose" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Rose_icon.svg/1024px-Rose_icon.svg.png" style="bottom:20px; right:20px;">

<!-- 🌙 OPENING -->
<div id="opening">
    <h1>TLEOTS GUIDE</h1>
    <p>MB World</p>
</div>

<!-- 🚪 ENTER WORLD -->
<div id="enter">
    <button onclick="startWorld()">Enter World</button>
</div>

<!-- ⚡ SCRIPT -->
<script>

setTimeout(() => {
    document.getElementById("opening").style.opacity = "0";

    setTimeout(() => {
        document.getElementById("opening").style.display = "none";
        document.getElementById("enter").style.display = "flex";
    }, 1000);

}, 3000);

function startWorld(){
    alert("Welcome to TLEOTS");
}

</script>

</body>
</html>
