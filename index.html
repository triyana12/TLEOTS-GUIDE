<!DOCTYPE html>
<html>
<head>
<title>TLEOTS GUIDE</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:serif;
    text-align:center;
    overflow:hidden;
    position:relative;

    /* 📜 background kertas kuno */
    background:
    radial-gradient(circle at 20% 30%, rgba(255, 240, 200, 0.4), transparent 60%),
    radial-gradient(circle at 70% 60%, rgba(210, 180, 140, 0.4), transparent 55%),
    linear-gradient(135deg, #7a5a3a, #5a3f28);
}

/* 🌸 BUNGA BIRU GAMBAR ASLI */
#flower{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0.18;          /* 🔥 dibuat samar */
    filter:blur(1px);      /* biar dreamy */
    z-index:1;
    pointer-events:none;
}

/* OPENING */
#opening{
    position:absolute;
    z-index:2;
}

/* ENTER WORLD */
#enter{
    display:none;
    flex-direction:column;
    align-items:center;
    z-index:2;
}

/* 🌙 Welcome */
.welcome{
    font-size:22px;
    color:#f5e6d3;
    font-style:italic;
    letter-spacing:2px;
}

/* 🌟 TITLE */
h1{
    font-size:55px;
    margin:5px 0;

    font-family:"Georgia","Times New Roman",serif;
    font-style:italic;
    font-weight:bold;

    background: linear-gradient(90deg, #6fa8dc, #ffd700, #6fa8dc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:0 0 10px rgba(255,215,0,0.5),
                0 0 20px rgba(111,168,220,0.4);
}

/* subtitle */
p{
    opacity:0.85;
    color:#f5e6d3;
    font-style:italic;
}

/* 🚪 BUTTON ENTER WORLD */
button{
    margin-top:35px;
    padding:22px 65px;
    font-size:28px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    color:white;

    background: linear-gradient(45deg, #6fa8dc, #ff6ec7, #ffd700);
    background-size:300% 300%;

    box-shadow:0 10px 25px rgba(0,0,0,0.4);

    transition:0.3s;
    animation:gradientMove 5s infinite;
}

button:hover{
    transform:scale(1.15) translateY(-5px);
}

/* animasi warna */
@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
</style>

</head>

<body>

<!-- 🌸 BUNGA BIRU -->
<img id="flower" src="file_000000006b4871f8a2917a5b332f0c0d">

<!-- 🌙 OPENING -->
<div id="opening">
    <div class="welcome">Welcome to</div>
    <h1>TLEOTS GUIDE</h1>
    <p>MB World</p>
</div>

<!-- 🚪 ENTER WORLD -->
<div id="enter">
    <button onclick="startWorld()">Enter World</button>
</div>

<script>

setTimeout(() => {
    document.getElementById("opening").style.display = "none";
    document.getElementById("enter").style.display = "flex";
}, 2500);

function startWorld(){
    alert("Welcome to TLEOTS");
}

</script>

</body>
</html>
